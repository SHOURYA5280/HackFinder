name: Daily hackathon update

on:
  schedule:
    - cron: "0 3 * * *"   # 3 AM UTC every day
  workflow_dispatch: {}    # lets you trigger it manually to test

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest scrape from Bright Data
        env:
          BRIGHT_DATA_API_TOKEN: ${{ secrets.BRIGHT_DATA_API_TOKEN }}
          WEMAKEDEVS_COLLECTOR_ID: ${{ secrets.WEMAKEDEVS_COLLECTOR_ID }}
          DEVPOST_COLLECTOR_ID: ${{ secrets.DEVPOST_COLLECTOR_ID }}
        run: python run_daily_update.py

      - name: Parse, merge, and rebuild the site
        run: |
          python parse_wemakedevs.py raw_wemakedevs.csv wemakedevs_clean.json
          python parse_devpost.py raw_devpost.csv devpost_clean.json
          python merge_sources.py wemakedevs_clean.json devpost_clean.json hackathons_combined.json
          python build_site.py hackathons_combined.json

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html *.json
          git diff --staged --quiet || git commit -m "Auto-update: daily hackathon refresh"
          git push